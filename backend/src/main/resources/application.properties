spring.application.name=backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus
spring.datasource.username=nexus
spring.datasource.password=nexus
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - Changed to validate for Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration
jwt.secret=${NEXUS_JWT_SECRET:3f5a7c9e1b4d6f8a2c4e6f8a0b2d4e6f8a0c2e4f6a8b0c2d4e6f8a0b2c4d6e8}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Server Error Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Test-only overrides: hermetic in-memory datasource so `mvn test` passes
# without a running Postgres/Redis (Redis stays best-effort for the context).
spring.datasource.url=jdbc:h2:mem:nexus-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
